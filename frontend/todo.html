<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMitra Todo Tracker</title>

    <!-- CHART JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FULL CALENDAR -->

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#dbeafe;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:30px;
            font-size:45px;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .todo-box{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.15);

            margin-bottom:40px;
        }

        input, select{

            width:100%;

            padding:15px;

            margin-top:15px;

            border-radius:10px;

            border:1px solid #ccc;

            font-size:16px;
        }

        button{

            width:100%;

            padding:15px;

            margin-top:20px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .todo-list{

            display:grid;

            gap:20px;
        }

        .task-card{

            background:white;

            padding:25px;

            border-radius:20px;

            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .task-title{

            font-size:24px;

            color:#2563eb;

            margin-bottom:10px;

            font-weight:bold;
        }

        .priority{

            margin-top:10px;

            font-weight:bold;
        }

        .high{
            color:red;
        }

        .medium{
            color:orange;
        }

        .low{
            color:green;
        }

        .completed{
            color:#16a34a;
            font-weight:bold;
            margin-top:10px;
        }

        .pending{
            color:#dc2626;
            font-weight:bold;
            margin-top:10px;
        }

        .chart-container{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.15);

            margin-bottom:40px;
        }

        #calendar{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.15);

            margin-top:40px;
        }

        .fc-daygrid-event{

            background:#22c55e !important;

            border:none !important;

            color:white !important;
        }

    </style>

</head>

<body>

    <h1>✅ MindMitra Todo Tracker</h1>

    <div class="container">

        <!-- TODO FORM -->

        <div class="todo-box">

            <input type="text" id="title" placeholder="Task Title">

            <input type="text" id="category" placeholder="Category (Assignments, Work, etc.)">

            <input type="text" id="subtask" placeholder="Subtask (Maths, Physics, etc.)">

            <input type="date" id="date">

            <select id="priority">

                <option>High</option>
                <option>Medium</option>
                <option>Low</option>

            </select>

            <button onclick="saveTask()">
                Add Task
            </button>

        </div>

        <!-- PIE CHART -->

        <div class="chart-container">

            <h2 style="margin-bottom:20px; color:#2563eb;">
                Productivity Progress 📊
            </h2>

            <canvas id="progressChart"></canvas>

        </div>

        <!-- HEATMAP -->

        <div id="calendar"></div>

        <!-- TASK LIST -->

        <div class="todo-list" id="todoList">

        </div>

    </div>

    <script>

        const API_URL = "http://localhost:8081/todo";

        let allTasks = [];

        async function saveTask(){

            const title = document.getElementById("title").value;
            const category = document.getElementById("category").value;
            const subtask = document.getElementById("subtask").value;
            const date = document.getElementById("date").value;
            const priority = document.getElementById("priority").value;

            const userId = localStorage.getItem("userId");

            try{

                const response = await fetch(`${API_URL}/save`,{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        title,
                        category,
                        subtask,
                        date,
                        priority,
                        completed:false,
                        userId

                    })

                });

                const data = await response.text();

                alert(data);

                loadTasks();

            }

            catch(error){

                console.log(error);

                alert("Server Error");

            }

        }

        async function loadTasks(){

            const userId = localStorage.getItem("userId");

            try{

                const response =
                    await fetch(`${API_URL}/user/${userId}`);

                const tasks = await response.json();

                allTasks = tasks;

                displayTasks(tasks);

                loadChart(tasks);

                loadCalendar(tasks);

            }

            catch(error){

                console.log(error);

            }

        }

        function displayTasks(tasks){

            const todoList = document.getElementById("todoList");

            todoList.innerHTML = "";

            tasks.forEach(task => {

                todoList.innerHTML += `

                    <div class="task-card">

                        <div class="task-title">
                            ${task.title}
                        </div>

                        <p><strong>Category:</strong> ${task.category}</p>

                        <p><strong>Subtask:</strong> ${task.subtask}</p>

                        <p><strong>Date:</strong> ${task.date}</p>

                        <div class="priority ${task.priority.toLowerCase()}">
                            Priority: ${task.priority}
                        </div>

                        <div class="${task.completed ? 'completed' : 'pending'}">

                            ${task.completed ? '✔ Completed' : '❌ Pending'}

                        </div>

                        <button onclick="markComplete(${task.id})">

                            Mark Completed

                        </button>

                    </div>

                `;

            });

        }

        async function markComplete(taskId){

            try{

                await fetch(`${API_URL}/complete/${taskId}`,{

                    method:"PUT"

                });

                loadTasks();

            }

            catch(error){

                console.log(error);

            }

        }

        function loadChart(tasks){

            const completed =
                tasks.filter(task => task.completed).length;

            const pending =
                tasks.filter(task => !task.completed).length;

            const ctx =
                document.getElementById('progressChart');

            new Chart(ctx, {

                type: 'pie',

                data: {

                    labels: ['Completed', 'Pending'],

                    datasets: [{

                        data: [completed, pending]

                    }]

                }

            });

        }

        function loadCalendar(tasks){

            const calendarEl =
                document.getElementById('calendar');

            calendarEl.innerHTML = "";

            const events = tasks
                .filter(task => task.completed)
                .map(task => ({

                    title: '✔ Task Done',

                    start: task.date

                }));

            const calendar =
                new FullCalendar.Calendar(calendarEl, {

                    initialView: 'dayGridMonth',

                    height:650,

                    events: events

                });

            calendar.render();

        }

        loadTasks();

    </script>

</body>
</html>
