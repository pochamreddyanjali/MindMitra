<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMitra Admin Login</title>

    <style>

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

            font-family:Arial, Helvetica, sans-serif;

        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #fee2e2,
                #fecaca,
                #fca5a5
            );

            padding:20px;

        }

        .login-box{

            width:100%;

            max-width:450px;

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:0 10px 25px rgba(0,0,0,0.2);

            text-align:center;

        }

        .icon{

            font-size:80px;

            margin-bottom:20px;

        }

        h1{

            color:#dc2626;

            margin-bottom:10px;

            font-size:40px;

        }

        .subtitle{

            color:#666;

            margin-bottom:35px;

            font-size:18px;

        }

        .input-group{

            margin-bottom:25px;

            text-align:left;

        }

        .input-group label{

            display:block;

            margin-bottom:8px;

            color:#444;

            font-weight:bold;

        }

        .input-group input{

            width:100%;

            padding:15px;

            border-radius:12px;

            border:1px solid #ddd;

            font-size:16px;

            outline:none;

        }

        .input-group input:focus{

            border:1px solid #dc2626;

        }

        .login-btn{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:#dc2626;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;

        }

        .login-btn:hover{

            background:#b91c1c;

        }

        .message{

            margin-top:20px;

            font-size:16px;

            font-weight:bold;

        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="icon">🛡️</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Secure access for MindMitra administrators
        </p>

        <div class="input-group">

            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter admin email">

        </div>

        <div class="input-group">

            <label>Password</label>

            <input type="password"
                   id="password"
                   placeholder="Enter password">

        </div>

        <button class="login-btn"
                onclick="loginAdmin()">

            Login

        </button>

        <div class="message" id="message">

        </div>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/admin";

        async function loginAdmin(){

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            if(email === "" || password === ""){

                message.style.color = "red";

                message.innerText =
                    "Please fill all fields";

                return;

            }

            try{

                const response =
                    await fetch(`${API_URL}/login`,{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        email,
                        password

                    })

                });

                const result =
                    await response.text();

                if(result === "SUCCESS"){

                    message.style.color =
                        "green";

                    message.innerText =
                        "Login Successful";

                    localStorage.setItem(
                        "adminEmail",
                        email
                    );

                    setTimeout(() => {

                        window.location.href =
                            "admin-dashboard.html";

                    },1000);

                }

                else{

                    message.style.color =
                        "red";

                    message.innerText =
                        result;

                }

            }

            catch(error){

                message.style.color =
                    "red";

                message.innerText =
                    "Server Error";

            }

        }

    </script>

</body>
</html>
