<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Specialist Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#ecfdf5;

            min-height:100vh;

            padding:30px;
        }

        .container{

            max-width:900px;

            margin:auto;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;
        }

        h1{

            color:#059669;

            font-size:45px;
        }

        .back-btn{

            padding:12px 20px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            cursor:pointer;

            font-size:16px;
        }

        .profile-card{

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .profile-top{

            text-align:center;

            margin-bottom:35px;
        }

        .profile-image{

            width:130px;

            height:130px;

            border-radius:50%;

            object-fit:cover;

            border:5px solid #059669;

            margin-bottom:20px;
        }

        .upload-box{

            margin-top:10px;
        }

        .grid{

            display:grid;

            grid-template-columns:
                repeat(auto-fit,minmax(300px,1fr));

            gap:25px;
        }

        .input-group{

            display:flex;

            flex-direction:column;
        }

        .input-group label{

            margin-bottom:8px;

            font-weight:bold;

            color:#444;
        }

        .input-group input,
        .input-group textarea{

            padding:15px;

            border-radius:12px;

            border:1px solid #ddd;

            font-size:16px;

            outline:none;
        }

        textarea{

            resize:none;

            height:120px;
        }

        .full-width{

            grid-column:1/-1;
        }

        .save-btn{

            width:100%;

            margin-top:35px;

            padding:16px;

            border:none;

            border-radius:15px;

            background:#059669;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        .save-btn:hover{

            background:#047857;
        }

        .message{

            margin-top:20px;

            text-align:center;

            font-size:17px;

            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- TOP -->

        <div class="top-bar">

            <h1>👤 My Profile</h1>

            <button class="back-btn"
                    onclick="goBack()">

                Back

            </button>

        </div>

        <!-- PROFILE CARD -->

        <div class="profile-card">

            <!-- PROFILE IMAGE -->

            <div class="profile-top">

                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                     class="profile-image"
                     id="profilePreview">

                <div class="upload-box">

                    <input type="file"
                           id="imageInput"
                           accept="image/*"
                           onchange="previewImage(event)">

                </div>

            </div>

            <!-- FORM -->

            <div class="grid">

                <div class="input-group">

                    <label>Full Name</label>

                    <input type="text"
                           id="name">

                </div>

                <div class="input-group">

                    <label>Email</label>

                    <input type="email"
                           id="email"
                           readonly>

                </div>

                <div class="input-group">

                    <label>Phone</label>

                    <input type="text"
                           id="phone">

                </div>

                <div class="input-group">

                    <label>Specialization</label>

                    <input type="text"
                           id="specialization">

                </div>

                <div class="input-group">

                    <label>Qualification</label>

                    <input type="text"
                           id="qualification">

                </div>

                <div class="input-group">

                    <label>Experience</label>

                    <input type="text"
                           id="experience">

                </div>

                <div class="input-group full-width">

                    <label>Professional Bio</label>

                    <textarea id="bio"></textarea>

                </div>

            </div>

            <!-- BUTTON -->

            <button class="save-btn"
                    onclick="saveProfile()">

                Save Changes

            </button>

            <div class="message"
                 id="message"></div>

        </div>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/specialist";

        const specialistEmail =
            localStorage.getItem(
                "specialistEmail"
            );

        let profileImage = "";

        // SECURITY CHECK

        if(!specialistEmail){

            window.location.href =
                "specialist-login.html";

        }

        // IMAGE PREVIEW

        function previewImage(event){

            const reader =
                new FileReader();

            reader.onload = function(){

                profileImage =
                    reader.result;

                document.getElementById(
                    "profilePreview"
                ).src = profileImage;

            };

            reader.readAsDataURL(
                event.target.files[0]
            );

        }

        // LOAD PROFILE

        async function loadProfile(){

            try{

                const response =
                    await fetch(

                        `${API_URL}/profile/${specialistEmail}`

                    );

                const specialist =
                    await response.json();

                document.getElementById("name").value =
                    specialist.name || "";

                document.getElementById("email").value =
                    specialist.email || "";

                document.getElementById("phone").value =
                    specialist.phone || "";

                document.getElementById("specialization").value =
                    specialist.specialization || "";

                document.getElementById("qualification").value =
                    specialist.qualification || "";

                document.getElementById("experience").value =
                    specialist.experience || "";

                document.getElementById("bio").value =
                    specialist.bio || "";

                profileImage =
                    specialist.profileImage || "";

                if(profileImage){

                    document.getElementById(
                        "profilePreview"
                    ).src = profileImage;

                }

            }

            catch(error){

                console.log(error);

            }

        }

        // SAVE PROFILE

        async function saveProfile(){

            const specialist = {

                email:
                    document.getElementById("email").value,

                name:
                    document.getElementById("name").value,

                phone:
                    document.getElementById("phone").value,

                specialization:
                    document.getElementById("specialization").value,

                qualification:
                    document.getElementById("qualification").value,

                experience:
                    document.getElementById("experience").value,

                bio:
                    document.getElementById("bio").value,

                profileImage

            };

            try{

                const response =
                    await fetch(

                        `${API_URL}/update-profile`,

                        {

                            method:"PUT",

                            headers:{
                                "Content-Type":"application/json"
                            },

                            body:JSON.stringify(
                                specialist
                            )

                        }

                    );

                const result =
                    await response.text();

                document.getElementById("message")
                    .innerText = result;

            }

            catch(error){

                document.getElementById("message")
                    .innerText =
                    "Server Error";

            }

        }

        // BACK

        function goBack(){

            window.location.href =
                "specialist-dashboard.html";

        }

        // INITIAL LOAD

        loadProfile();

    </script>

</body>
</html>
