<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMitra Mandala Coloring</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#dbeafe;

            min-height:100vh;

            padding:30px;

            text-align:center;

            overflow-x:hidden;
        }

        h1{

            color:#2563eb;

            font-size:45px;

            margin-bottom:10px;
        }

        .subtitle{

            color:#555;

            font-size:20px;

            margin-bottom:30px;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;

            flex-wrap:wrap;

            gap:20px;
        }

        .box{

            background:white;

            padding:15px 25px;

            border-radius:15px;

            box-shadow:0 4px 10px rgba(0,0,0,0.15);

            font-size:20px;

            font-weight:bold;

            color:#2563eb;
        }

        .best{

            color:#16a34a;
        }

        .palette{

            display:flex;

            justify-content:center;

            gap:15px;

            margin-bottom:40px;

            flex-wrap:wrap;
        }

        .color{

            width:55px;

            height:55px;

            border-radius:50%;

            cursor:pointer;

            border:4px solid white;

            transition:0.3s;
        }

        .color:hover{

            transform:scale(1.1);
        }

        .mandala-container{

            display:flex;

            justify-content:center;

            align-items:center;

            margin-bottom:40px;
        }

        .paint{

            cursor:pointer;

            transition:0.3s;
        }

        .paint:hover{

            transform:scale(1.02);

            filter:brightness(1.1);
        }

        .game-over{

            background:white;

            padding:30px;

            border-radius:20px;

            display:none;

            max-width:500px;

            margin:auto;

            box-shadow:0 4px 20px rgba(0,0,0,0.2);
        }

        .game-over h2{

            color:#2563eb;

            margin-bottom:20px;
        }

        button{

            padding:15px 30px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;

            margin-top:20px;
        }

        .history{

            margin-top:20px;

            text-align:left;
        }

        .history-item{

            background:#dbeafe;

            padding:10px;

            border-radius:10px;

            margin-top:10px;
        }

    </style>

</head>

<body>

    <h1>🌸 Mandala Coloring</h1>

    <div class="subtitle">
        Relax your mind through lotus and peacock mandala art 🦚
    </div>

    <div class="top-bar">

        <div class="box" id="score">
            Score: 0
        </div>

        <div class="box best" id="bestScore">
            Best: 0
        </div>

    </div>

    <!-- COLOR PALETTE -->

    <div class="palette">

        <div class="color"
            style="background:#fca5a5"
            onclick="selectColor('#fca5a5')"></div>

        <div class="color"
            style="background:#fcd34d"
            onclick="selectColor('#fcd34d')"></div>

        <div class="color"
            style="background:#86efac"
            onclick="selectColor('#86efac')"></div>

        <div class="color"
            style="background:#93c5fd"
            onclick="selectColor('#93c5fd')"></div>

        <div class="color"
            style="background:#c4b5fd"
            onclick="selectColor('#c4b5fd')"></div>

        <div class="color"
            style="background:#f9a8d4"
            onclick="selectColor('#f9a8d4')"></div>

        <div class="color"
            style="background:#fdba74"
            onclick="selectColor('#fdba74')"></div>

    </div>

    <!-- MANDALA SVG -->

    <div class="mandala-container">

        <svg id="mandalaSVG"
             width="650"
             height="650"
             viewBox="0 0 650 650">

            <!-- CENTER -->

            <circle class="paint"
                cx="325"
                cy="325"
                r="70"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <!-- LOTUS PETALS -->

            <ellipse class="paint"
                cx="325"
                cy="170"
                rx="55"
                ry="110"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <ellipse class="paint"
                cx="325"
                cy="480"
                rx="55"
                ry="110"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <ellipse class="paint"
                cx="170"
                cy="325"
                rx="110"
                ry="55"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <ellipse class="paint"
                cx="480"
                cy="325"
                rx="110"
                ry="55"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <!-- FLOWERS -->

            <ellipse class="paint"
                cx="220"
                cy="220"
                rx="50"
                ry="95"
                transform="rotate(-45 220 220)"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <ellipse class="paint"
                cx="430"
                cy="220"
                rx="50"
                ry="95"
                transform="rotate(45 430 220)"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <ellipse class="paint"
                cx="220"
                cy="430"
                rx="50"
                ry="95"
                transform="rotate(45 220 430)"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <ellipse class="paint"
                cx="430"
                cy="430"
                rx="50"
                ry="95"
                transform="rotate(-45 430 430)"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <!-- PEACOCK FEATHERS -->

            <path class="paint"
                d="M325 40
                   Q360 120 325 200
                   Q290 120 325 40"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <path class="paint"
                d="M610 325
                   Q530 360 450 325
                   Q530 290 610 325"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <path class="paint"
                d="M325 610
                   Q360 530 325 450
                   Q290 530 325 610"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

            <path class="paint"
                d="M40 325
                   Q120 360 200 325
                   Q120 290 40 325"
                fill="white"
                stroke="#93c5fd"
                stroke-width="4"/>

        </svg>

    </div>

    <!-- GAME OVER -->

    <div class="game-over" id="gameOver">

        <h2>✨ Mandala Complete ✨</h2>

        <p id="finalScore"></p>

        <div class="history" id="history">

        </div>

        <button onclick="restartGame()">
            Play Again
        </button>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/game";

        const userId =
            localStorage.getItem("userId");

        const gameName =
            "Mandala Game";

        let selectedColor =
            "#fca5a5";

        let score = 0;

        let colored = 0;

        // LOAD BEST SCORE

        async function loadBestScore(){

            const response =
                await fetch(
                    `${API_URL}/best/${userId}/${encodeURIComponent(gameName)}`
                );

            const best =
                await response.text();

            document.getElementById("bestScore")
                .innerText =
                "Best: " + best;

        }

        // LOAD HISTORY

        async function loadHistory(){

            const response =
                await fetch(
                    `${API_URL}/history/${userId}/${encodeURIComponent(gameName)}`
                );

            const scores =
                await response.json();

            const history =
                document.getElementById("history");

            history.innerHTML =
                "<h3>Previous Scores</h3>";

            scores.reverse().forEach(item => {

                history.innerHTML += `

                    <div class="history-item">

                        Score: ${item.score}

                    </div>

                `;

            });

        }

        // SELECT COLOR

        function selectColor(color){

            selectedColor = color;

        }

        // CREATE MANDALA

        function createMandala(){

            const shapes =
                document.querySelectorAll(".paint");

            shapes.forEach(shape => {

                shape.addEventListener("click", () => {

                    if(shape.dataset.colored)
                        return;

                    shape.style.fill =
                        selectedColor;

                    shape.dataset.colored =
                        "true";

                    score += 10;

                    colored++;

                    document.getElementById("score")
                        .innerText =
                        "Score: " + score;

                    if(colored === shapes.length){

                        endGame();

                    }

                });

            });

        }

        // END GAME

        async function endGame(){

            document.getElementById("gameOver")
                .style.display =
                "block";

            document.getElementById("finalScore")
                .innerText =
                "Your Mandala Score: " + score;

            const oldBest =
                parseInt(
                    document.getElementById("bestScore")
                    .innerText.replace("Best: ","")
                );

            await fetch(`${API_URL}/save`,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    gameName:gameName,
                    score:score,
                    userId:userId

                })

            });

            await loadBestScore();

            await loadHistory();

            if(score > oldBest){

                celebrateNewBest();

            }

        }

        // CELEBRATION

        function celebrateNewBest(){

            for(let i = 0; i < 100; i++){

                const confetti =
                    document.createElement("div");

                confetti.innerHTML =
                    ["🎉","✨","🌸","🦚"]
                    [Math.floor(Math.random()*4)];

                confetti.style.position =
                    "absolute";

                confetti.style.left =
                    Math.random() *
                    window.innerWidth + "px";

                confetti.style.top =
                    "-50px";

                confetti.style.fontSize =
                    (Math.random()*30 + 20) + "px";

                confetti.style.zIndex =
                    "9999";

                confetti.style.transition =
                    "all 3s linear";

                document.body.appendChild(confetti);

                setTimeout(() => {

                    confetti.style.top =
                        window.innerHeight + "px";

                    confetti.style.transform =
                        `rotate(${Math.random()*720}deg)`;

                },50);

                setTimeout(() => {

                    confetti.remove();

                },3000);

            }

        }

        // RESTART

        function restartGame(){

            location.reload();

        }

        createMandala();

        loadBestScore();

    </script>

</body>
</html>
