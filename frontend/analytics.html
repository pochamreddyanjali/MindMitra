<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMitra Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#ecfdf5;

            min-height:100vh;

            padding:30px;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:40px;
        }

        .top-bar h1{

            color:#059669;

            font-size:50px;
        }

        .back-btn{

            padding:14px 24px;

            border:none;

            border-radius:12px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .back-btn:hover{

            background:#1d4ed8;
        }

        .stats-container{

            display:grid;

            grid-template-columns:
                repeat(auto-fit,minmax(250px,1fr));

            gap:25px;

            margin-bottom:40px;
        }

        .card{

            background:white;

            padding:30px;

            border-radius:20px;

            text-align:center;

            box-shadow:0 4px 15px rgba(0,0,0,0.1);

            transition:0.3s;
        }

        .card:hover{

            transform:translateY(-8px);
        }

        .card h2{

            color:#555;

            margin-bottom:15px;

            font-size:22px;
        }

        .card p{

            font-size:50px;

            font-weight:bold;

            color:#059669;
        }

        .chart-box{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

    <!-- TOP -->

    <div class="top-bar">

        <h1>📊 Analytics Dashboard</h1>

        <button class="back-btn"
                onclick="goBack()">

            Back

        </button>

    </div>

    <!-- STATS -->

    <div class="stats-container">

        <div class="card">

            <h2>Total Requests</h2>

            <p id="total">

                0

            </p>

        </div>

        <div class="card">

            <h2>Accepted</h2>

            <p id="accepted">

                0

            </p>

        </div>

        <div class="card">

            <h2>Rejected</h2>

            <p id="rejected">

                0

            </p>

        </div>

        <div class="card">

            <h2>Pending</h2>

            <p id="pending">

                0

            </p>

        </div>

    </div>

    <!-- CHART -->

    <div class="chart-box">

        <canvas id="analyticsChart">

        </canvas>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/appointment";

        // =========================
        // GET SPECIALIST EMAIL
        // =========================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const specialistEmail =
            params.get("specialistEmail");

        // =========================
        // LOAD ANALYTICS
        // =========================

        async function loadAnalytics(){

            try{

                const response =
                    await fetch(

                        `${API_URL}/specialist/${specialistEmail}`

                    );

                const appointments =
                    await response.json();

                // COUNTS

                const total =
                    appointments.length;

                const accepted =
                    appointments.filter(a =>

                        a.status === "ACCEPTED"

                    ).length;

                const rejected =
                    appointments.filter(a =>

                        a.status === "REJECTED"

                    ).length;

                const pending =
                    appointments.filter(a =>

                        a.status === "PENDING"

                    ).length;

                // UPDATE STATS

                document.getElementById(
                    "total"
                ).innerText = total;

                document.getElementById(
                    "accepted"
                ).innerText = accepted;

                document.getElementById(
                    "rejected"
                ).innerText = rejected;

                document.getElementById(
                    "pending"
                ).innerText = pending;

                // CHART

                createChart(

                    accepted,

                    rejected,

                    pending

                );

            }

            catch(error){

                console.log(error);

            }

        }

        // =========================
        // CREATE CHART
        // =========================

        function createChart(

            accepted,

            rejected,

            pending

        ){

            const ctx =
                document.getElementById(
                    "analyticsChart"
                );

            new Chart(ctx, {

                type:"bar",

                data:{

                    labels:[

                        "Accepted",

                        "Rejected",

                        "Pending"

                    ],

                    datasets:[{

                        label:"Appointments",

                        data:[

                            accepted,

                            rejected,

                            pending

                        ],

                        backgroundColor:[

                            "#10b981",

                            "#ef4444",

                            "#f59e0b"

                        ],

                        borderRadius:12,

                        borderWidth:1

                    }]

                },

                options:{

                    responsive:true,

                    plugins:{

                        legend:{

                            display:false
                        }

                    },

                    scales:{

                        y:{

                            beginAtZero:true
                        }

                    }

                }

            });

        }

        // =========================
        // GO BACK
        // =========================

        function goBack(){

            window.location.href =

            `specialist-dashboard.html?specialistEmail=${specialistEmail}`;

        }

        // =========================
        // INITIAL LOAD
        // =========================

        loadAnalytics();

    </script>

</body>

</html>
