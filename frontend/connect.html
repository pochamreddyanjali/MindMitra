<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Connect Specialist</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#ecfdf5;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:30px;
        }

        .form-box{

            background:white;

            width:100%;

            max-width:650px;

            padding:40px;

            border-radius:25px;

            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h1{

            text-align:center;

            color:#059669;

            margin-bottom:20px;

            font-size:40px;
        }

        .specialist-box{

            text-align:center;

            margin-bottom:30px;

            font-size:20px;

            color:#444;
        }

        .input-group{

            margin-bottom:20px;
        }

        .input-group label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#444;
        }

        .input-group input,
        .input-group textarea{

            width:100%;

            padding:15px;

            border-radius:12px;

            border:1px solid #ddd;

            font-size:16px;

            outline:none;
        }

        textarea{

            resize:none;

            height:140px;
        }

        .submit-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:15px;

            background:#059669;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        .submit-btn:hover{

            background:#047857;
        }

        .message{

            text-align:center;

            margin-top:20px;

            font-size:18px;

            font-weight:bold;

            color:#059669;
        }

    </style>

</head>

<body>

    <div class="form-box">

        <h1>🩺 Connect Specialist</h1>

        <div class="specialist-box"
             id="specialistBox">

        </div>

        <div class="input-group">

            <label>Your Name</label>

            <input type="text"
                   id="name"
                   placeholder="Enter Your Name">

        </div>

        <div class="input-group">

            <label>Preferred Timing</label>

            <input type="text"
                   id="timing"
                   placeholder="Example : 5 PM - 7 PM">

        </div>

        <div class="input-group">

            <label>Your Issue</label>

            <textarea id="issue"
                      placeholder="Describe your issue..."></textarea>

        </div>

        <button class="submit-btn"
                onclick="submitRequest()">

            Submit Request

        </button>

        <div class="message"
             id="message">

        </div>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/appointment";

        // =========================
        // GET URL PARAMETERS
        // =========================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const userEmail =
            params.get("userEmail");

        const specialistEmail =
            params.get("specialistEmail");

        const specialistName =
            params.get("specialistName");

        // =========================
        // LOGIN CHECK
        // =========================

        if(
            !userEmail ||
            !specialistEmail
        ){

            alert(
                "Invalid Access"
            );

            window.location.href =
                "login.html";

        }

        // =========================
        // SHOW SPECIALIST NAME
        // =========================

        document.getElementById(
            "specialistBox"
        ).innerHTML =

            `Connecting with <b>${specialistName}</b>`;

        // =========================
        // SUBMIT REQUEST
        // =========================

        async function submitRequest(){

            const userName =
                document.getElementById(
                    "name"
                ).value;

            const preferredTiming =
                document.getElementById(
                    "timing"
                ).value;

            const issue =
                document.getElementById(
                    "issue"
                ).value;

            // VALIDATION

            if(
                !userName ||
                !preferredTiming ||
                !issue
            ){

                alert(
                    "Please Fill All Fields"
                );

                return;

            }

            const appointment = {

                userName:
                    userName,

                userEmail:
                    userEmail,

                issue:
                    issue,

                preferredTiming:
                    preferredTiming,

                specialistEmail:
                    specialistEmail,

                specialistName:
                    specialistName

            };

            try{

                const response =
                    await fetch(

                        `${API_URL}/save`,

                        {

                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:JSON.stringify(
                                appointment
                            )

                        }

                    );

                const result =
                    await response.text();

                document.getElementById(
                    "message"
                ).innerText =
                    result;

                // REDIRECT

                setTimeout(() => {

                    window.location.href =

                        `specialists.html?userEmail=${userEmail}`;

                }, 1500);

            }

            catch(error){

                document.getElementById(
                    "message"
                ).innerText =
                    "Server Error";

            }

        }

    </script>

</body>

</html>
