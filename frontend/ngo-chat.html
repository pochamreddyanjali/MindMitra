<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>NGO Chat</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            background:#f8fafc;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar{

            width:30%;

            background:white;

            border-right:1px solid #ddd;

            overflow-y:auto;
        }

        .sidebar-header{

            padding:25px;

            font-size:22px;

            font-weight:bold;

            color:#d97706;

            border-bottom:1px solid #ddd;
        }

        .member{

            padding:20px;

            border-bottom:1px solid #eee;

            cursor:pointer;
        }

        .member:hover{

            background:#f9fafb;
        }

        .member-name{

            font-size:24px;

            font-weight:bold;

            margin-bottom:8px;
        }

        .member-email{

            color:#444;
        }

        /* =========================
           CHAT AREA
        ========================= */

        .chat-container{

            width:70%;

            display:flex;

            flex-direction:column;

            background:#fffbeb;
        }

        .chat-header{

            background:#d97706;

            color:white;

            padding:25px;

            font-size:22px;

            font-weight:bold;
        }

        .chat-box{

            flex:1;

            overflow-y:auto;

            padding:25px;

            display:flex;

            flex-direction:column;

            gap:18px;
        }

        .message{

            max-width:70%;

            padding:16px;

            border-radius:18px;

            font-size:18px;
        }

        .sent{

            background:#2563eb;

            color:white;

            align-self:flex-end;
        }

        .received{

            background:white;

            border:1px solid #ddd;

            align-self:flex-start;
        }

        .chat-input{

            display:flex;

            gap:15px;

            padding:20px;

            background:white;

            border-top:1px solid #ddd;
        }

        .chat-input input{

            flex:1;

            padding:16px;

            border-radius:14px;

            border:1px solid #ccc;

            font-size:17px;
        }

        .chat-input button{

            padding:16px 28px;

            border:none;

            border-radius:14px;

            background:#d97706;

            color:white;

            cursor:pointer;

            font-size:17px;
        }

    </style>

</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================= -->

    <div class="sidebar">

        <div class="sidebar-header">

            👥 Group Members

        </div>

        <div id="memberList">

        </div>

    </div>

    <!-- =========================
         CHAT
    ========================= -->

    <div class="chat-container">

        <div class="chat-header"
             id="chatTitle">

            NGO Chat

        </div>

        <div class="chat-box"
             id="chatBox">

        </div>

        <div class="chat-input">

            <input type="text"
                   id="messageInput"
                   placeholder="Type message...">

            <button onclick="sendMessage()">

                Send

            </button>

        </div>

    </div>

<script>

    const API =
        "http://localhost:8081";

    // =========================
    // URL PARAMS
    // =========================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const groupId =
        params.get("groupId");

    const ngoEmail =
        params.get("ngoEmail") ||
        localStorage.getItem(
            "ngoEmail"
        ) ||
        "";

    const ngoName =
        params.get("ngoName") ||
        localStorage.getItem(
            "ngoName"
        ) ||
        "";

    // =========================
    // CURRENT CHAT USER
    // =========================

    let currentUserEmail = "";

    let currentUserName = "";

    // =========================
    // TITLE
    // =========================

    document.getElementById(
        "chatTitle"
    ).innerText =

        "NGO Chat";

    // =========================
    // LOAD MEMBERS
    // =========================

    async function loadMembers(){

        const response =
            await fetch(

                `${API}/ngo-group/members/${groupId}`

            );

        const members =
            await response.json();

        displayMembers(members);

    }

    // =========================
    // DISPLAY MEMBERS
    // =========================

    function displayMembers(members){

        const memberList =
            document.getElementById(
                "memberList"
            );

        memberList.innerHTML = "";

        members.forEach(member => {

            const userEmail =
                member.userEmail || "";

            const userName =
                member.userName &&
                member.userName !== "null"
                    ? member.userName
                    :
                member.name ||
                userEmail ||
                "User";

            memberList.innerHTML += `

                <div class="member"

                     onclick="
                     openChat(
                        '${userEmail}',
                        '${userName}'
                     )">

                    <div class="member-name">

                        ${userName}

                    </div>

                    <div class="member-email">

                        ${userEmail}

                    </div>

                </div>

            `;

        });

    }

    // =========================
    // OPEN CHAT
    // =========================

    function openChat(email,name){

        currentUserEmail = email;

        currentUserName =
            name || "User";

        document.getElementById(
            "chatTitle"
        ).innerText =

            `Chat with ${currentUserName}`;

        loadMessages();

    }

    // =========================
    // LOAD MESSAGES
    // =========================

    async function loadMessages(){

        if(currentUserEmail === "")
            return;

        const response =
            await fetch(

                `${API}/ngo-chat/chat?sender=${ngoEmail}&receiver=${currentUserEmail}`

            );

        const messages =
            await response.json();

        displayMessages(messages);

    }

    // =========================
    // DISPLAY MESSAGES
    // =========================

    function displayMessages(messages){

        const chatBox =
            document.getElementById(
                "chatBox"
            );

        chatBox.innerHTML = "";

        messages.forEach(msg => {

            const type =

                msg.senderEmail === ngoEmail

                ? "sent"

                : "received";

            chatBox.innerHTML += `

                <div class="message ${type}">

                    ${msg.message}

                </div>

            `;

        });

        chatBox.scrollTop =
            chatBox.scrollHeight;

    }

    // =========================
    // SEND MESSAGE
    // =========================

    async function sendMessage(){

        const input =
            document.getElementById(
                "messageInput"
            );

        const text =
            input.value.trim();

        if(text === "")
            return;

        await fetch(

            `${API}/ngo-chat/send`,

            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    groupId,

                    senderEmail:ngoEmail,

                    senderName:ngoName,

                    receiverEmail:currentUserEmail,

                    message:text

                })

            }

        );

        input.value = "";

        loadMessages();

    }

    // =========================
    // AUTO REFRESH
    // =========================

    setInterval(() => {

        loadMessages();

    },2000);

    // =========================
    // INITIAL LOAD
    // =========================

    loadMembers();

</script>

</body>
</html>
