<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMitra Color Therapy</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#dbeafe;

            min-height:100vh;

            padding:30px;
        }

        h1{

            text-align:center;

            color:#2563eb;

            font-size:45px;

            margin-bottom:10px;
        }

        .subtitle{

            text-align:center;

            color:#555;

            font-size:20px;

            margin-bottom:30px;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;

            flex-wrap:wrap;

            gap:20px;
        }

        .box{

            background:white;

            padding:15px 25px;

            border-radius:15px;

            box-shadow:0 4px 10px rgba(0,0,0,0.15);

            font-size:20px;

            font-weight:bold;

            color:#2563eb;
        }

        .best{

            color:#16a34a;
        }

        .game-container{

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;
        }

        .color-display{

            width:250px;

            height:250px;

            border-radius:30px;

            margin-bottom:30px;

            transition:0.5s;

            box-shadow:0 4px 20px rgba(0,0,0,0.2);
        }

        .buttons{

            display:grid;

            grid-template-columns:repeat(3,120px);

            gap:20px;
        }

        .color-btn{

            width:120px;

            height:120px;

            border:none;

            border-radius:20px;

            cursor:pointer;

            transition:0.3s;
        }

        .color-btn:hover{

            transform:scale(1.08);
        }

        .status{

            margin-top:30px;

            font-size:28px;

            color:#2563eb;

            font-weight:bold;
        }

        .game-over{

            margin-top:40px;

            background:white;

            padding:30px;

            border-radius:20px;

            text-align:center;

            display:none;

            box-shadow:0 4px 15px rgba(0,0,0,0.15);
        }

        .game-over h2{

            color:#2563eb;

            margin-bottom:20px;
        }

        button.restart{

            padding:15px 30px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;

            margin-top:20px;
        }

        .history{

            margin-top:20px;

            text-align:left;
        }

        .history-item{

            background:#dbeafe;

            padding:10px;

            border-radius:10px;

            margin-top:10px;
        }

    </style>

</head>

<body>

    <h1>🎨 Color Therapy Game</h1>

    <div class="subtitle">
        Match soothing colors and calm your mind 🌈
    </div>

    <div class="top-bar">

        <div class="box" id="score">
            Score: 0
        </div>

        <div class="box" id="timer">
            Time: 30
        </div>

        <div class="box best" id="bestScore">
            Best: 0
        </div>

    </div>

    <!-- GAME -->

    <div class="game-container">

        <div class="color-display" id="targetColor">

        </div>

        <div class="buttons" id="buttons">

        </div>

        <div class="status" id="status">
            Match the color
        </div>

    </div>

    <!-- GAME OVER -->

    <div class="game-over" id="gameOver">

        <h2>✨ Therapy Complete ✨</h2>

        <p id="finalScore"></p>

        <div class="history" id="history">

        </div>

        <button class="restart" onclick="restartGame()">
            Play Again
        </button>

    </div>

    <script>

        const API_URL = "http://localhost:8081/game";

        const userId = localStorage.getItem("userId");

        const gameName = "Color Game";

        const colors = [

            "#60a5fa",
            "#34d399",
            "#f9a8d4",
            "#fcd34d",
            "#a78bfa",
            "#fca5a5"

        ];

        let score = 0;

        let correctColor = "";

        let timeLeft = 30;

        let timerInterval;

        // LOAD BEST SCORE

        async function loadBestScore(){

            const response =
                await fetch(
                    `${API_URL}/best/${userId}/${encodeURIComponent(gameName)}`
                );

            const best = await response.text();

            document.getElementById("bestScore").innerText =
                "Best: " + best;

        }

        // LOAD HISTORY

        async function loadHistory(){

            const response =
                await fetch(
                    `${API_URL}/history/${userId}/${encodeURIComponent(gameName)}`
                );

            const scores = await response.json();

            const history =
                document.getElementById("history");

            history.innerHTML =
                "<h3>Previous Scores</h3>";

            scores.reverse().forEach(item => {

                history.innerHTML += `

                    <div class="history-item">

                        Score: ${item.score}

                    </div>

                `;

            });

        }

        // START TIMER

        function startTimer(){

            timerInterval = setInterval(() => {

                timeLeft--;

                document.getElementById("timer")
                    .innerText =
                    "Time: " + timeLeft;

                if(timeLeft <= 0){

                    clearInterval(timerInterval);

                    endGame();

                }

            },1000);

        }

        // START ROUND

        function startRound(){

            const target =
                document.getElementById("targetColor");

            const buttons =
                document.getElementById("buttons");

            buttons.innerHTML = "";

            correctColor =
                colors[Math.floor(Math.random()*colors.length)];

            target.style.background = correctColor;

            let shuffled =
                [...colors].sort(() => 0.5 - Math.random());

            shuffled.forEach(color => {

                const btn =
                    document.createElement("button");

                btn.classList.add("color-btn");

                btn.style.background = color;

                btn.addEventListener("click", () => {

                    if(timeLeft <= 0) return;

                    if(color === correctColor){

                        score += 10;

                        document.getElementById("status")
                            .innerText =
                            "✨ Correct Match";

                    }

                    else{

                        document.getElementById("status")
                            .innerText =
                            "❌ Wrong Color";

                    }

                    document.getElementById("score")
                        .innerText =
                        "Score: " + score;

                    startRound();

                });

                buttons.appendChild(btn);

            });

        }

        // END GAME

        async function endGame(){

            document.getElementById("gameOver")
                .style.display = "block";

            document.getElementById("finalScore")
                .innerText =
                "Your Therapy Score: " + score;

            const oldBest =
                parseInt(
                    document.getElementById("bestScore")
                    .innerText.replace("Best: ","")
                );

            await fetch(`${API_URL}/save`,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    gameName:gameName,
                    score,
                    userId

                })

            });

            await loadBestScore();

            await loadHistory();

            if(score > oldBest){

                celebrateNewBest();

            }

        }

        // CELEBRATION

        function celebrateNewBest(){

            for(let i = 0; i < 100; i++){

                const confetti =
                    document.createElement("div");

                confetti.innerHTML =
                    ["🎉","✨","🎨","🌈"]
                    [Math.floor(Math.random()*4)];

                confetti.style.position =
                    "absolute";

                confetti.style.left =
                    Math.random() *
                    window.innerWidth + "px";

                confetti.style.top =
                    "-50px";

                confetti.style.fontSize =
                    (Math.random()*30 + 20) + "px";

                confetti.style.zIndex =
                    "9999";

                confetti.style.transition =
                    "all 3s linear";

                document.body.appendChild(confetti);

                setTimeout(() => {

                    confetti.style.top =
                        window.innerHeight + "px";

                    confetti.style.transform =
                        `rotate(${Math.random()*720}deg)`;

                },50);

                setTimeout(() => {

                    confetti.remove();

                },3000);

            }

        }

        // RESTART

        function restartGame(){

            location.reload();

        }

        // START GAME

        startRound();

        startTimer();

        loadBestScore();

    </script>

</body>
</html>
