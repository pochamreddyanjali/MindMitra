<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMitra Focus Tap Challenge</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            overflow:hidden;

            height:100vh;

            background:linear-gradient(to bottom,#dbeafe,#eff6ff);

            position:relative;
        }

        h1{

            position:absolute;

            top:20px;

            width:100%;

            text-align:center;

            color:#2563eb;

            font-size:45px;
        }

        .subtitle{

            position:absolute;

            top:80px;

            width:100%;

            text-align:center;

            color:#555;

            font-size:20px;
        }

        .top-bar{

            position:absolute;

            top:20px;

            width:100%;

            display:flex;

            justify-content:space-between;

            padding:0 30px;
        }

        .box{

            background:white;

            padding:15px 25px;

            border-radius:15px;

            box-shadow:0 4px 10px rgba(0,0,0,0.15);

            font-size:20px;

            font-weight:bold;

            color:#2563eb;
        }

        .best{

            color:#16a34a;
        }

        .target{

            width:80px;

            height:80px;

            border-radius:50%;

            background:#2563eb;

            position:absolute;

            cursor:pointer;

            transition:0.2s;
        }

        .target:hover{

            transform:scale(1.1);
        }

        .game-over{

            position:absolute;

            top:50%;

            left:50%;

            transform:translate(-50%,-50%);

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:0 4px 20px rgba(0,0,0,0.2);

            text-align:center;

            display:none;
        }

        .game-over h2{

            color:#2563eb;

            margin-bottom:20px;
        }

        button{

            padding:15px 30px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;

            margin-top:20px;
        }

        .history{

            margin-top:20px;

            text-align:left;
        }

        .history-item{

            background:#dbeafe;

            padding:10px;

            border-radius:10px;

            margin-top:10px;
        }

    </style>

</head>

<body>

    <h1>⚡ Focus Tap Challenge</h1>

    <div class="subtitle">
        Improve concentration and mindfulness 🌿
    </div>

    <div class="top-bar">

        <div class="box" id="score">
            Score: 0
        </div>

        <div class="box" id="timer">
            Time: 30
        </div>

        <div class="box best" id="bestScore">
            Best: 0
        </div>

    </div>

    <!-- GAME OVER -->

    <div class="game-over" id="gameOver">

        <h2>✨ Focus Session Complete ✨</h2>

        <p id="finalScore"></p>

        <div class="history" id="history">

        </div>

        <button onclick="restartGame()">
            Play Again
        </button>

    </div>

    <script>

        const API_URL = "http://localhost:8081/game";

        const userId = localStorage.getItem("userId");

        let score = 0;

        let timeLeft = 30;

        let gameRunning = true;

        async function loadBestScore(){

            const response =
                await fetch(`${API_URL}/best/${userId}/Focus Game`);

            const best = await response.text();

            document.getElementById("bestScore").innerText =
                "Best: " + best;

        }

        async function loadHistory(){

            const response =
                await fetch(`${API_URL}/history/${userId}/Focus Game`);

            const scores = await response.json();

            const history =
                document.getElementById("history");

            history.innerHTML =
                "<h3>Previous Scores</h3>";

            scores.reverse().forEach(item => {

                history.innerHTML += `

                    <div class="history-item">

                        Score: ${item.score}

                    </div>

                `;

            });

        }

        function createTarget(){

            if(!gameRunning) return;

            const target =
                document.createElement("div");

            target.classList.add("target");

            target.style.left =
                Math.random() * (window.innerWidth - 100)
                + "px";

            target.style.top =
                Math.random() * (window.innerHeight - 100)
                + "px";

            document.body.appendChild(target);

            target.addEventListener("click", () => {

                score++;

                document.getElementById("score")
                    .innerText =
                    "Score: " + score;

                target.remove();

                createTarget();

            });

            setTimeout(() => {

                target.remove();

                if(gameRunning){

                    createTarget();

                }

            },1000);

        }

        function startTimer(){

            const timerInterval = setInterval(() => {

                timeLeft--;

                document.getElementById("timer")
                    .innerText =
                    "Time: " + timeLeft;

                if(timeLeft <= 0){

                    clearInterval(timerInterval);

                    endGame();

                }

            },1000);

        }

        async function endGame(){

            gameRunning = false;

            document.querySelectorAll(".target")
                .forEach(target => target.remove());

            document.getElementById("finalScore")
                .innerText =
                "Your Focus Score: " + score;

            document.getElementById("gameOver")
                .style.display = "block";

            await fetch(`${API_URL}/save`,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    gameName:"Focus Game",
                    score,
                    userId

                })

            });

            loadBestScore();

            loadHistory();

        }

        function restartGame(){

            location.reload();

        }

        createTarget();

        startTimer();

        loadBestScore();

    </script>

</body>
</html>
