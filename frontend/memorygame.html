<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMitra Memory Match</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#dbeafe;

            min-height:100vh;

            padding:30px;
        }

        h1{

            text-align:center;

            color:#2563eb;

            font-size:45px;

            margin-bottom:15px;
        }

        .subtitle{

            text-align:center;

            color:#555;

            margin-bottom:30px;

            font-size:20px;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;

            flex-wrap:wrap;

            gap:20px;
        }

        .score-box{

            background:white;

            padding:15px 25px;

            border-radius:15px;

            box-shadow:0 4px 10px rgba(0,0,0,0.15);

            font-size:20px;

            font-weight:bold;

            color:#2563eb;
        }

        .best-score{

            color:#16a34a;
        }

        .game-board{

            display:grid;

            grid-template-columns:repeat(4,120px);

            gap:20px;

            justify-content:center;
        }

        .card{

            width:120px;

            height:120px;

            background:#2563eb;

            border-radius:20px;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:50px;

            cursor:pointer;

            transition:0.3s;

            color:transparent;
        }

        .card.flipped{

            background:white;

            color:black;

            transform:rotateY(180deg);
        }

        .game-over{

            margin-top:40px;

            background:white;

            padding:30px;

            border-radius:20px;

            text-align:center;

            display:none;

            box-shadow:0 4px 15px rgba(0,0,0,0.15);
        }

        .game-over h2{

            color:#2563eb;

            margin-bottom:20px;
        }

        button{

            padding:15px 30px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;

            margin-top:20px;
        }

        .history{

            margin-top:20px;

            text-align:left;
        }

        .history-item{

            background:#dbeafe;

            padding:10px;

            border-radius:10px;

            margin-top:10px;
        }

    </style>

</head>

<body>

    <h1>🧠 Memory Match Game</h1>

    <div class="subtitle">
        Improve focus and relax your mind 🌿
    </div>

    <div class="top-bar">

        <div class="score-box" id="moves">
            Moves: 0
        </div>

        <div class="score-box best-score" id="bestScore">
            Best: 0
        </div>

    </div>

    <!-- GAME BOARD -->

    <div class="game-board" id="gameBoard">

    </div>

    <!-- GAME OVER -->

    <div class="game-over" id="gameOver">

        <h2>✨ Congratulations ✨</h2>

        <p id="finalScore"></p>

        <div class="history" id="history">

        </div>

        <button onclick="restartGame()">
            Play Again
        </button>

    </div>

    <script>

        const API_URL = "http://localhost:8081/game";

        const userId = localStorage.getItem("userId");

        let emojis = [

            "🌸","🌸",
            "🌈","🌈",
            "🫧","🫧",
            "🌿","🌿",
            "☁️","☁️",
            "💙","💙",
            "⭐","⭐",
            "🌼","🌼"

        ];

        let shuffled = emojis.sort(() => 0.5 - Math.random());

        let moves = 0;

        let matched = 0;

        let firstCard = null;

        let secondCard = null;

        let lockBoard = false;

        const board =
            document.getElementById("gameBoard");

        async function loadBestScore(){

            const response =
                await fetch(`${API_URL}/best/${userId}/Memory Game`);

            const best = await response.text();

            document.getElementById("bestScore").innerText =
                "Best: " + best;

        }

        async function loadHistory(){

            const response =
                await fetch(`${API_URL}/history/${userId}/Memory Game`);

            const scores = await response.json();

            const history =
                document.getElementById("history");

            history.innerHTML =
                "<h3>Previous Scores</h3>";

            scores.reverse().forEach(item => {

                history.innerHTML += `

                    <div class="history-item">

                        Score: ${item.score}

                    </div>

                `;

            });

        }

        function createBoard(){

            shuffled.forEach(emoji => {

                const card =
                    document.createElement("div");

                card.classList.add("card");

                card.dataset.emoji = emoji;

                card.innerText = emoji;

                card.addEventListener("click",
                    flipCard);

                board.appendChild(card);

            });

        }

        function flipCard(){

            if(lockBoard) return;

            if(this === firstCard) return;

            this.classList.add("flipped");

            if(!firstCard){

                firstCard = this;

                return;

            }

            secondCard = this;

            lockBoard = true;

            moves++;

            document.getElementById("moves").innerText =
                "Moves: " + moves;

            checkMatch();

        }

        function checkMatch(){

            if(firstCard.dataset.emoji ===
                secondCard.dataset.emoji){

                matched++;

                resetBoard();

                if(matched === 8){

                    endGame();

                }

            }

            else{

                setTimeout(() => {

                    firstCard.classList.remove("flipped");

                    secondCard.classList.remove("flipped");

                    resetBoard();

                },1000);

            }

        }

        function resetBoard(){

            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }

        async function endGame(){

            const score = 100 - moves;

            document.getElementById("finalScore")
                .innerText =
                "Your Score: " + score;

            document.getElementById("gameOver")
                .style.display = "block";

            await fetch(`${API_URL}/save`,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    gameName:"Memory Game",
                    score,
                    userId

                })

            });

            loadBestScore();

            loadHistory();

        }

        function restartGame(){

            location.reload();

        }

        createBoard();

        loadBestScore();

    </script>

</body>
</html>
