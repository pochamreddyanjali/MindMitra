<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMitra NGO Registration</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #fef3c7,
                #fde68a,
                #fcd34d
            );

            padding:30px;
        }

        .register-box{

            width:100%;

            max-width:650px;

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .icon{

            text-align:center;

            font-size:80px;

            margin-bottom:20px;
        }

        h1{

            text-align:center;

            color:#d97706;

            margin-bottom:10px;

            font-size:40px;
        }

        .subtitle{

            text-align:center;

            color:#666;

            margin-bottom:35px;

            font-size:18px;
        }

        .input-group{

            margin-bottom:22px;
        }

        .input-group label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#444;
        }

        .input-group input,
        .input-group textarea{

            width:100%;

            padding:15px;

            border-radius:12px;

            border:1px solid #ddd;

            outline:none;

            font-size:16px;
        }

        .input-group textarea{

            resize:none;

            height:100px;
        }

        .register-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:12px;

            background:#d97706;

            color:white;

            font-size:18px;

            cursor:pointer;
        }

        .message{

            margin-top:20px;

            text-align:center;

            font-size:17px;

            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="register-box">

        <div class="icon">🤝</div>

        <h1>NGO Registration</h1>

        <p class="subtitle">
            Register your NGO with MindMitra
        </p>

        <div class="input-group">

            <label>NGO Name</label>

            <input type="text"
                   id="name">

        </div>

        <div class="input-group">

            <label>Email</label>

            <input type="email"
                   id="email">

        </div>

        <div class="input-group">

            <label>Password</label>

            <input type="password"
                   id="password">

        </div>

        <div class="input-group">

            <label>Phone</label>

            <input type="text"
                   id="phone">

        </div>

        <div class="input-group">

            <label>Address</label>

            <input type="text"
                   id="address">

        </div>

        <div class="input-group">

            <label>Description</label>

            <textarea id="description"></textarea>

        </div>

        <button class="register-btn"
                onclick="registerNgo()">

            Register NGO

        </button>

        <div class="message"
             id="message"></div>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/ngo";

        async function registerNgo(){

            const ngo = {

                name:
                    document.getElementById("name").value,

                email:
                    document.getElementById("email").value,

                password:
                    document.getElementById("password").value,

                phone:
                    document.getElementById("phone").value,

                address:
                    document.getElementById("address").value,

                description:
                    document.getElementById("description").value

            };

            const response =
                await fetch(`${API_URL}/register`,{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify(ngo)

                });

            const result =
                await response.text();

            document.getElementById("message")
                .innerText = result;

        }

    </script>

</body>
</html>
