<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMitra Journal</title>

    <!-- FULL CALENDAR -->

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#dbeafe;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:30px;
            font-size:45px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        .journal-box{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.15);

            margin-bottom:40px;
        }

        input, textarea, select{

            width:100%;

            padding:15px;

            margin-top:15px;

            border-radius:10px;

            border:1px solid #ccc;

            font-size:16px;
        }

        textarea{

            height:200px;

            resize:none;
        }

        button{

            width:100%;

            padding:15px;

            margin-top:20px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:18px;

            cursor:pointer;
        }

        button:hover{

            background:#1d4ed8;
        }

        .journal-history{

            display:grid;

            gap:20px;

            margin-top:30px;
        }

        .card{

            background:white;

            padding:25px;

            border-radius:20px;

            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .card h3{

            color:#2563eb;

            margin-bottom:10px;
        }

        .mood{

            font-weight:bold;

            margin-top:10px;
        }

        .date{

            color:#666;

            margin-top:10px;

            font-size:14px;
        }

        /* HEATMAP */

        #calendar{

            margin-top:40px;

            background:white;

            padding:25px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.15);
        }

        .fc-daygrid-event{

            background:#22c55e !important;

            border:none !important;

            color:white !important;

            font-size:12px;

            border-radius:8px;

            padding:2px;
        }

    </style>

</head>

<body>

    <h1>📝 MindMitra Journal</h1>

    <div class="container">

        <!-- JOURNAL FORM -->

        <div class="journal-box">

            <input type="text" id="title" placeholder="Journal Title">

            <input type="date" id="date">

            <select id="mood">

                <option>Happy 😊</option>
                <option>Sad 😔</option>
                <option>Angry 😡</option>
                <option>Calm 😌</option>
                <option>Anxious 😰</option>

            </select>

            <textarea id="content" placeholder="Write your thoughts here..."></textarea>

            <textarea id="gratitude" placeholder="What are you grateful for today?"></textarea>

            <button onclick="saveJournal()">
                Save Journal
            </button>

        </div>

        <!-- SEARCH SECTION -->

        <div class="journal-box">

            <h2 style="color:#2563eb; margin-bottom:15px;">
                Search Journal By Date
            </h2>

            <input type="date" id="searchDate">

            <button onclick="searchByDate()">
                Search
            </button>

            <button onclick="loadJournals()">
                Show All Journals
            </button>

        </div>

        <!-- HEATMAP CALENDAR -->

        <div id="calendar"></div>

        <!-- JOURNAL HISTORY -->

        <div class="journal-history" id="journalHistory">

        </div>

    </div>

    <script>

        const API_URL = "http://localhost:8081/journal";

        let allJournals = [];

        async function saveJournal(){

            const title = document.getElementById("title").value;
            const date = document.getElementById("date").value;
            const content = document.getElementById("content").value;
            const mood = document.getElementById("mood").value;
            const gratitude = document.getElementById("gratitude").value;

            const userId = localStorage.getItem("userId");

            try{

                const response = await fetch(`${API_URL}/save`,{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        title,
                        date,
                        content,
                        mood,
                        gratitude,
                        userId

                    })

                });

                const data = await response.text();

                alert(data);

                loadJournals();

            }

            catch(error){

                console.log(error);

                alert("Server Error");

            }

        }

        async function loadJournals(){

            const userId = localStorage.getItem("userId");

            try{

                const response = await fetch(`${API_URL}/user/${userId}`);

                const journals = await response.json();

                allJournals = journals;

                displayJournals(journals);

                loadCalendar(journals);

            }

            catch(error){

                console.log(error);

            }

        }

        async function searchByDate(){

            const userId = localStorage.getItem("userId");

            const date = document.getElementById("searchDate").value;

            try{

                const response =
                    await fetch(`${API_URL}/user/${userId}/${date}`);

                const journals = await response.json();

                displayJournals(journals);

            }

            catch(error){

                console.log(error);

            }

        }

        function displayJournals(journals){

            const history = document.getElementById("journalHistory");

            history.innerHTML = "";

            journals.forEach(journal => {

                history.innerHTML += `

                    <div class="card">

                        <h3>${journal.title}</h3>

                        <p>${journal.content}</p>

                        <div class="mood">${journal.mood}</div>

                        <p><strong>Gratitude:</strong> ${journal.gratitude}</p>

                        <div class="date">
                            📅 ${journal.date}
                        </div>

                    </div>

                `;

            });

        }

        function loadCalendar(journals){

            const calendarEl = document.getElementById('calendar');

            calendarEl.innerHTML = "";

            const events = journals.map(journal => ({

                title: '✓ Journal Written',

                start: journal.date

            }));

            const calendar = new FullCalendar.Calendar(calendarEl, {

                initialView: 'dayGridMonth',

                height: 650,

                events: events

            });

            calendar.render();

        }

        loadJournals();

    </script>

</body>
</html>
