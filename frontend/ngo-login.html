<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMitra NGO Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #fef3c7,
                #fde68a,
                #fcd34d
            );

            padding:20px;
        }

        .login-box{

            width:100%;

            max-width:450px;

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:0 10px 25px rgba(0,0,0,0.2);

            text-align:center;
        }

        .icon{

            font-size:80px;

            margin-bottom:20px;
        }

        h1{

            color:#d97706;

            margin-bottom:10px;

            font-size:40px;
        }

        .subtitle{

            color:#666;

            margin-bottom:35px;

            font-size:18px;
        }

        .input-group{

            margin-bottom:25px;

            text-align:left;
        }

        .input-group label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;
        }

        .input-group input{

            width:100%;

            padding:15px;

            border-radius:12px;

            border:1px solid #ddd;

            font-size:16px;
        }

        .login-btn{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:#d97706;

            color:white;

            font-size:18px;

            cursor:pointer;
        }

        .message{

            margin-top:20px;

            font-size:16px;

            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="icon">🤝</div>

        <h1>NGO Login</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <div class="input-group">

            <label>Email</label>

            <input type="email"
                   id="email">

        </div>

        <div class="input-group">

            <label>Password</label>

            <input type="password"
                   id="password">

        </div>

        <button class="login-btn"
                onclick="loginNgo()">

            Login

        </button>

        <div class="message"
             id="message"></div>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/ngo";

        async function loginNgo(){

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const response =
                await fetch(`${API_URL}/login`,{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        email,
                        password

                    })

                });

            const result =
                await response.text();

            const message =
                document.getElementById("message");

            if(result.startsWith("SUCCESS")){

                const ngoResponse =
                    await fetch(
                        `${API_URL}/get/${encodeURIComponent(email)}`
                    );

                const ngo =
                    await ngoResponse.json();

                // STORE NGO EMAIL

                localStorage.setItem(
                    "ngoEmail",
                    email
                );

                // STORE NGO NAME

                localStorage.setItem(
                    "ngoName",
                    ngo.name || ""
                );

                // REDIRECT

                window.location.href =
                    "ngo-dashboard.html";

            }

            else{

                message.innerText = result;

            }

        }

    </script>

</body>
</html>
