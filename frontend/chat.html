<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMitra Chat</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#ecfdf5;

            height:100vh;

            display:flex;

            flex-direction:column;
        }

        .top-bar{

            background:#059669;

            color:white;

            padding:20px;

            font-size:24px;

            font-weight:bold;

            display:flex;

            justify-content:space-between;

            align-items:center;
        }

        .back-btn{

            padding:10px 18px;

            border:none;

            border-radius:10px;

            background:white;

            color:#059669;

            cursor:pointer;

            font-weight:bold;
        }

        .chat-container{

            flex:1;

            padding:20px;

            overflow-y:auto;

            display:flex;

            flex-direction:column;

            gap:15px;
        }

        .message{

            max-width:70%;

            padding:15px;

            border-radius:18px;

            line-height:1.6;

            font-size:16px;

            word-wrap:break-word;
        }

        .sent{

            background:#059669;

            color:white;

            align-self:flex-end;

            border-bottom-right-radius:5px;
        }

        .received{

            background:white;

            color:#333;

            align-self:flex-start;

            border-bottom-left-radius:5px;

            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .time{

            margin-top:8px;

            font-size:12px;

            opacity:0.8;
        }

        .bottom-bar{

            background:white;

            padding:20px;

            display:flex;

            gap:15px;

            border-top:1px solid #ddd;
        }

        .bottom-bar input{

            flex:1;

            padding:15px;

            border-radius:12px;

            border:1px solid #ddd;

            font-size:16px;

            outline:none;
        }

        .send-btn{

            padding:15px 25px;

            border:none;

            border-radius:12px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .send-btn:hover{

            background:#1d4ed8;
        }

    </style>

</head>

<body>

    <!-- TOP -->

    <div class="top-bar">

        <div id="chatName">
            Chat
        </div>

        <button class="back-btn"
                onclick="goBack()">

            Back

        </button>

    </div>

    <!-- CHAT -->

    <div class="chat-container"
         id="chatContainer">

    </div>

    <!-- SEND -->

    <div class="bottom-bar">

        <input type="text"
               id="messageInput"
               placeholder="Type your message...">

        <button class="send-btn"
                onclick="sendMessage()">

            Send

        </button>

    </div>

    <script>

        const API_URL =
            "http://localhost:8081/message";

        // =========================
        // GET URL PARAMS
        // =========================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const sender =
            params.get("sender");

        const receiver =
            params.get("receiver");

        const name =
            params.get("name");

        // =========================
        // SECURITY CHECK
        // =========================

        if(
            !sender ||
            !receiver
        ){

            window.location.href =
                "index.html";

        }

        // =========================
        // SHOW NAME
        // =========================

        document.getElementById(
            "chatName"
        ).innerText =

            `💬 Chat with ${name}`;

        // =========================
        // GO BACK
        // =========================

        function goBack(){

            history.back();

        }

        // =========================
        // MARK AS SEEN
        // =========================

        async function markAsSeen(){

            try{

                await fetch(

                    `${API_URL}/seen?sender=${receiver}&receiver=${sender}`,

                    {

                        method:"PUT"

                    }

                );

            }

            catch(error){

                console.log(error);

            }

        }

        // =========================
        // LOAD CHAT
        // =========================

        async function loadChat(){

            try{

                // MARK RECEIVED MESSAGES AS SEEN

                await markAsSeen();

                const response =
                    await fetch(

                        `${API_URL}/chat?sender=${sender}&receiver=${receiver}`

                    );

                const messages =
                    await response.json();

                const container =
                    document.getElementById(
                        "chatContainer"
                    );

                container.innerHTML = "";

                messages.forEach(msg => {

                    const messageClass =

                        msg.senderEmail === sender

                        ?

                        "sent"

                        :

                        "received";

                    container.innerHTML += `

                        <div class="message ${messageClass}">

                            ${msg.message}

                            <div class="time">

                                ${msg.timestamp}

                                ${msg.seen
                                    ?
                                    " • Seen"
                                    :
                                    " • Delivered"
                                }

                            </div>

                        </div>

                    `;

                });

                // AUTO SCROLL

                container.scrollTop =
                    container.scrollHeight;

            }

            catch(error){

                console.log(error);

            }

        }

        // =========================
        // SEND MESSAGE
        // =========================

        async function sendMessage(){

            const input =
                document.getElementById(
                    "messageInput"
                );

            const message =
                input.value.trim();

            if(message === ""){

                return;

            }

            try{

                await fetch(

                    `${API_URL}/send`,

                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            senderEmail:
                                sender,

                            receiverEmail:
                                receiver,

                            message:
                                message

                        })

                    }

                );

                input.value = "";

                loadChat();

            }

            catch(error){

                console.log(error);

            }

        }

        // =========================
        // ENTER KEY SEND
        // =========================

        document
            .getElementById("messageInput")

            .addEventListener(

                "keypress",

                function(event){

                    if(event.key === "Enter"){

                        sendMessage();

                    }

                }

            );

        // =========================
        // AUTO REFRESH
        // =========================

        setInterval(() => {

            loadChat();

        },2000);

        // =========================
        // INITIAL LOAD
        // =========================

        loadChat();

    </script>

</body>

</html>
