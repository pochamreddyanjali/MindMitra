<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMitra NGO Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#fffbeb;

            min-height:100vh;

            padding:30px;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:40px;
        }

        h1{

            color:#d97706;

            font-size:45px;
        }

        .logout-btn{

            padding:14px 24px;

            border:none;

            border-radius:12px;

            background:#dc2626;

            color:white;

            cursor:pointer;
        }

        .welcome{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.1);

            margin-bottom:35px;
        }

        .cards{

            display:grid;

            grid-template-columns:
                repeat(auto-fit,minmax(280px,1fr));

            gap:25px;
        }

        .card{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.1);

            cursor:pointer;

            transition:0.3s;
        }

        .card:hover{

            transform:translateY(-8px);
        }

        .icon{

            font-size:60px;

            margin-bottom:20px;
        }

        .card h3{

            color:#d97706;

            margin-bottom:15px;
        }

    </style>

</head>

<body>

    <div class="top-bar">

        <h1>🤝 NGO Dashboard</h1>

        <button class="logout-btn"
                onclick="logoutNgo()">

            Logout

        </button>

    </div>

    <div class="welcome">

        <h2 id="welcomeText">
            Welcome NGO
        </h2>

        <p>
            Support communities and collaborate
            with MindMitra initiatives 🌿
        </p>

    </div>

    <div class="cards">

        <!-- COMMUNITY -->

        
        <!-- EVENTS -->



        <!-- NGO GROUPS -->

        <div class="card"
             onclick="openGroups()">

            <div class="icon">👥</div>

            <h3>NGO Groups</h3>

            <p>
                Create and manage
                NGO community groups.
            </p>

        </div>

        <!-- GROUP REQUESTS -->

        <div class="card"
             onclick="openRequests()">

            <div class="icon">📥</div>

            <h3>Group Requests</h3>

            <p>
                Approve or reject
                private group join requests.
            </p>

        </div>

    </div>

    <script>

        const ngoEmail =
            localStorage.getItem(
                "ngoEmail"
            );

        const ngoName =
            localStorage.getItem(
                "ngoName"
            );

        if(!ngoEmail){

            window.location.href =
                "ngo-login.html";

        }

        document.getElementById(
            "welcomeText"
        ).innerText =
            "Welcome " + ngoEmail;

        // =========================
        // OPEN NGO GROUPS
        // =========================

        function openGroups(){

            window.location.href =
                `ngo-groups.html?ngoEmail=${encodeURIComponent(ngoEmail)}&ngoName=${encodeURIComponent(ngoName || "")}`;

        }

        // =========================
        // OPEN REQUESTS
        // =========================

        function openRequests(){

            window.location.href =
                "group-requests.html";

        }

        // =========================
        // LOGOUT
        // =========================

        function logoutNgo(){

            localStorage.removeItem(
                "ngoEmail"
            );

            localStorage.removeItem(
                "ngoName"
            );

            window.location.href =
                "ngo-login.html";

        }

    </script>

</body>
</html>
